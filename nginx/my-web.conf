server {
    listen 80;
    listen [::]:80;

    server_name _;
    root /var/www/my-web/html;
    index index.html index.htm;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
        root /var/www/my-web/html;
    }
}
