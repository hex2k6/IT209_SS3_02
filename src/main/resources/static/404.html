<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Khong tim thay trang</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f8fb;
            color: #1f2937;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
        }

        main {
            width: min(92vw, 640px);
            padding: 40px;
            border: 1px solid #d8dee9;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 18px 45px rgba(31, 41, 55, 0.08);
            text-align: center;
        }

        .code {
            margin: 0 0 12px;
            color: #2563eb;
            font-size: 72px;
            font-weight: 700;
            line-height: 1;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            margin: 0 auto;
            max-width: 480px;
            color: #4b5563;
            font-size: 16px;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 28px;
            padding: 12px 18px;
            border-radius: 6px;
            background: #2563eb;
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
        }

        a:focus,
        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <main>
        <p class="code">404</p>
        <h1>Khong tim thay trang</h1>
        <p>Duong dan ban vua truy cap khong ton tai hoac da duoc di chuyen. Vui long kiem tra lai dia chi URL.</p>
        <a href="/">Quay ve trang chu</a>
    </main>
</body>
</html>
